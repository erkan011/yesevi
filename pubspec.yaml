name: yesevi_gaziantep
description: Bağış Kutusu Takip Sistemi - Yesevi Hareketi Gaziantep
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.2.0
  firebase_storage: ^12.1.0
  google_maps_flutter: ^2.9.0
  geolocator: ^12.0.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  uuid: ^4.4.0
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.3
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/yesevilogo.jpeg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
